 
<!DOCTYPE>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macabre Movies | Recommender</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body> 

  <header>
    <h1>🦇 Macabre Movies</h1>
    <p>Summon recommendations from the cinematic abyss...</p>
    <div class="search-box">
      <input type="text" id="movieInput" placeholder="Enter a film title...">
      <button id="searchBtn">Conjure</button>
    </div>
  </header> 

  <main>
    <h2 id="resultTitle" class="hidden">Visions Prophesied</h2>
    <div id="movieGrid" class="movie-grid"></div>
  </main> 

  <div id="movieModal" class="modal-overlay hidden">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <h2 id="modalTitle">Movie Title</h2>
      <p id="modalOverview" class="overview-text"></p>
      <div id="trailerContainer" class="trailer-container">
        </div>
    </div>
  </div> 

  <script src="app.js"></script>
</body>
</html>
